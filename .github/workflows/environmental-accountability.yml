name: Environmental Accountability release checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/web/app/showrooms/environmental-accountability/**'
      - 'apps/web/public/environmental-accountability/**'
      - 'scripts/verify-environmental-accountability-assets.mjs'
      - '.github/workflows/environmental-accountability.yml'

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out proposed branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify all ten images and frozen reference PDF
        run: node scripts/verify-environmental-accountability-assets.mjs
      - name: Install website dependencies
        working-directory: apps/web
        run: npm ci
      - name: Type-check website
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: Build website
        working-directory: apps/web
        run: npm run build
