name: Governed Air Simulation Tests
on:
  push:
    branches: [governed-air-foundation]
    paths:
      - 'governed-air/**'
      - '.github/workflows/governed-air-tests.yml'
  workflow_dispatch:
jobs:
  simulation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test simulated governance decisions
        run: node --test governed-air/decision-engine.test.mjs
