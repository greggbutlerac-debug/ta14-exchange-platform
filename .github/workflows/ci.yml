name: Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned npm
        run: npm install --global npm@10.8.1

      - name: Display runtime versions
        run: |
          node --version
          npm --version

      - name: Set public npm registry
        run: npm config set registry https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        timeout-minutes: 15

      - name: Run typecheck
        run: npm run typecheck

      - name: Run automated tests
        run: npm test

      # CI has no local Supabase stack, so the HPR GoTrue/PostgREST/Storage
      # integration suites are skipped here. Say so explicitly: skipped is not passed.
      - name: Report HPR local Supabase integration status
        if: ${{ env.HPR_LOCAL_SUPABASE_URL == '' }}
        run: |
          echo "::warning title=HPR local Supabase integration NOT EXECUTED::24 GoTrue/PostgREST/Storage integration tests were skipped in CI (no local stack): 10 field-evidence (#704) + 14 private photo upload / reconciliation (#730). Skipped is not passed and is not authorization evidence. Run scripts/hpr/local-supabase-verify.sh and attach verify.log."
          echo "### HPR local Supabase integration: NOT EXECUTED in CI" >> "$GITHUB_STEP_SUMMARY"
          echo "24 integration tests were skipped (no local stack): 10 field-evidence (#704) + 14 private photo upload / reconciliation (#730). Skipped is not passed. Evidence comes only from \`scripts/hpr/local-supabase-verify.sh\` logs." >> "$GITHUB_STEP_SUMMARY"

      - name: Build production application
        run: npm run build
