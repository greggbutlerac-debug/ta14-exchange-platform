<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="CONTROL RIGHT → CONSEQUENCE AUTHORITY → COMMIT PERMISSION"><defs><marker id="ah-bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f4f7fa"/></marker><marker id="ah-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0b2340"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0d1b2a"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a5d70"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c7d3df"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fd1"/></marker><marker id="ah-blue_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e6f0fc"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f8a4c"/></marker><marker id="ah-green_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e5f5ec"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b5730a"/></marker><marker id="ah-amber_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fdf3e1"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker><marker id="ah-red_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fdeceb"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b3fb5"/></marker><marker id="ah-violet_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#efe8fb"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f7c86"/></marker><marker id="ah-teal_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e2f4f5"/></marker><marker id="ah-gray_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#eef2f6"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/></marker><marker id="ah-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e7c76e"/></marker></defs><rect width="1536" height="1024" fill="#f4f7fa"/><rect x="0" y="0" width="1536" height="118" fill="#0b2340"/><text x="40" y="38" font-size="18" fill="#e7c76e" font-weight="700" letter-spacing="2">LESSON 08 OF 08</text><text x="40" y="78" font-size="34" fill="#ffffff" font-weight="700">CONTROL RIGHT → CONSEQUENCE AUTHORITY → COMMIT PERMISSION</text><text x="40" y="106" font-size="18" fill="#9fd8ff">David&#x27;s challenge showed that the former two-position dispute was mostly different layers of one transaction.</text>
<rect x="40" y="150" width="270" height="330" rx="12" fill="#e6f0fc" stroke="#1f6fd1" stroke-width="2"/>
<rect x="40" y="150" width="270" height="8" rx="3" fill="#1f6fd1"/>
<text x="56" y="192" font-size="17" fill="#1f6fd1" font-weight="700" text-anchor="start"><tspan x="56" dy="0.0">CONTROL RIGHT</tspan></text>
<text x="56" y="227.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="56" dy="0.0">Permission to issue a</tspan><tspan x="56" dy="19.2">defined command to a defined</tspan><tspan x="56" dy="19.2">point within defined limits.</tspan></text>
<text x="56" y="302.4" font-size="14" fill="#4a5d70" font-weight="400" text-anchor="start" font-style="italic"><tspan x="56" dy="0.0">From: a Connection instance</tspan><tspan x="56" dy="17.9">under a Profile, or a local</tspan><tspan x="56" dy="17.9">role.</tspan></text>
<line x1="310" y1="315" x2="330" y2="315" stroke="#1f6fd1" stroke-width="3" marker-end="url(#ah-blue)"/>
<rect x="330" y="150" width="270" height="330" rx="12" fill="#efe8fb" stroke="#6b3fb5" stroke-width="2"/>
<rect x="330" y="150" width="270" height="8" rx="3" fill="#6b3fb5"/>
<text x="346" y="192" font-size="17" fill="#6b3fb5" font-weight="700" text-anchor="start"><tspan x="346" dy="0.0">CONSEQUENCE AUTHORITY</tspan></text>
<text x="346" y="227.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="346" dy="0.0">Authority over the physical</tspan><tspan x="346" dy="19.2">consequence the command</tspan><tspan x="346" dy="19.2">causes.</tspan></text>
<text x="346" y="302.4" font-size="14" fill="#4a5d70" font-weight="400" text-anchor="start" font-style="italic"><tspan x="346" dy="0.0">From: owner, AHJ, law,</tspan><tspan x="346" dy="17.9">contract, operating policy or</tspan><tspan x="346" dy="17.9">authorized role. May be</tspan><tspan x="346" dy="17.9">delegated through a governed</tspan><tspan x="346" dy="17.9">connection when the grantor</tspan><tspan x="346" dy="17.9">holds it.</tspan></text>
<line x1="600" y1="315" x2="620" y2="315" stroke="#6b3fb5" stroke-width="3" marker-end="url(#ah-violet)"/>
<rect x="620" y="150" width="270" height="330" rx="12" fill="#e5f5ec" stroke="#1f8a4c" stroke-width="3"/>
<rect x="620" y="150" width="270" height="8" rx="3" fill="#1f8a4c"/>
<text x="636" y="192" font-size="17" fill="#1f8a4c" font-weight="700" text-anchor="start"><tspan x="636" dy="0.0">COMMIT PERMISSION</tspan></text>
<text x="636" y="227.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="636" dy="0.0">At the moment of actuation,</tspan><tspan x="636" dy="19.2">at the enforcement point:</tspan><tspan x="636" dy="19.2">may this exact consequence</tspan><tspan x="636" dy="19.2">proceed NOW?</tspan></text>
<text x="636" y="321.6" font-size="14" fill="#4a5d70" font-weight="400" text-anchor="start" font-style="italic"><tspan x="636" dy="0.0">TA-14 consequence examination</tspan><tspan x="636" dy="17.9">+ revocation state + scope +</tspan><tspan x="636" dy="17.9">safety interlocks.</tspan></text>
<line x1="890" y1="315" x2="910" y2="315" stroke="#1f8a4c" stroke-width="3" marker-end="url(#ah-green)"/>
<rect x="910" y="150" width="270" height="330" rx="12" fill="#fdf3e1" stroke="#b5730a" stroke-width="2"/>
<rect x="910" y="150" width="270" height="8" rx="3" fill="#b5730a"/>
<text x="926" y="192" font-size="17" fill="#b5730a" font-weight="700" text-anchor="start"><tspan x="926" dy="0.0">EXECUTION</tspan></text>
<text x="926" y="227.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="926" dy="0.0">The controller performs the</tspan><tspan x="926" dy="19.2">command.</tspan></text>
<text x="926" y="283.2" font-size="14" fill="#4a5d70" font-weight="400" text-anchor="start" font-style="italic"><tspan x="926" dy="0.0">Governed only when the</tspan><tspan x="926" dy="17.9">enforcement point is the sole</tspan><tspan x="926" dy="17.9">path to the controller.</tspan></text>
<line x1="1180" y1="315" x2="1200" y2="315" stroke="#b5730a" stroke-width="3" marker-end="url(#ah-amber)"/>
<rect x="1200" y="150" width="270" height="330" rx="12" fill="#e2f4f5" stroke="#0f7c86" stroke-width="2"/>
<rect x="1200" y="150" width="270" height="8" rx="3" fill="#0f7c86"/>
<text x="1216" y="192" font-size="17" fill="#0f7c86" font-weight="700" text-anchor="start"><tspan x="1216" dy="0.0">REALITY</tspan></text>
<text x="1216" y="227.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="1216" dy="0.0">The building changes. The</tspan><tspan x="1216" dy="19.2">outcome is recorded.</tspan></text>
<text x="1216" y="283.2" font-size="14" fill="#4a5d70" font-weight="400" text-anchor="start" font-style="italic"><tspan x="1216" dy="0.0">Recorded by the BAS and</tspan><tspan x="1216" dy="17.9">gateway.</tspan></text>
<rect x="620" y="492" width="270" height="66" rx="10" fill="#1f8a4c"/>
<text x="755" y="520" font-size="15" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="755" dy="0.0">TA-14 AT THE COMMIT BOUNDARY</tspan></text>
<text x="755" y="544" font-size="14" fill="#fff" font-weight="400" text-anchor="middle"><tspan x="755" dy="0.0">Evidence · Authority · Standing · NOW</tspan></text>
<rect x="40" y="585" width="720" height="165" rx="12" fill="#e6f0fc" stroke="#1f6fd1" stroke-width="2"/>
<rect x="40" y="585" width="720" height="6" rx="3" fill="#1f6fd1"/>
<text x="56" y="619" font-size="19" fill="#1f6fd1" font-weight="700" text-anchor="start"><tspan x="56" dy="0.0">WHAT DAVID&#x27;S CHALLENGE REVEALED</tspan></text>
<text x="56" y="654.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="56" dy="0.0">The old &#x27;Position A&#x27; was about where authority can come from: a valid delegated</tspan><tspan x="56" dy="19.2">grant can satisfy Applicable Authority. The old &#x27;Position B&#x27; was about where the</tspan><tspan x="56" dy="19.2">final gate sits: commit permission is a present-tense check at actuation. Mostly</tspan><tspan x="56" dy="19.2">two layers, not two architectures.</tspan></text>
<rect x="790" y="585" width="706" height="165" rx="12" fill="#efe8fb" stroke="#6b3fb5" stroke-width="2"/>
<rect x="790" y="585" width="706" height="6" rx="3" fill="#6b3fb5"/>
<text x="806" y="619" font-size="19" fill="#6b3fb5" font-weight="700" text-anchor="start"><tspan x="806" dy="0.0">WHERE AUTHORITY GENUINELY REMAINS LOCAL</tspan></text>
<circle cx="812" cy="649.0" r="3.5" fill="#6b3fb5"/>
<text x="824" y="654.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="824" dy="0.0">The grantor did not hold authority over the consequence</tspan></text>
<circle cx="812" cy="678.0" r="3.5" fill="#6b3fb5"/>
<text x="824" y="683.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="824" dy="0.0">The action is reserved by law, code, contract or the AHJ</tspan></text>
<circle cx="812" cy="707.0" r="3.5" fill="#6b3fb5"/>
<text x="824" y="712.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="824" dy="0.0">The request exceeds the grant</tspan></text>
<rect x="40" y="770" width="720" height="150" rx="12" fill="#e5f5ec" stroke="#1f8a4c" stroke-width="2"/>
<rect x="40" y="770" width="720" height="6" rx="3" fill="#1f8a4c"/>
<text x="56" y="804" font-size="19" fill="#1f8a4c" font-weight="700" text-anchor="start"><tspan x="56" dy="0.0">TA-14 DOES NOT ORIGINATE AUTHORITY</tspan></text>
<text x="56" y="839.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="56" dy="0.0">TA-14 verifies whether the Applicable Authority presented for the proposed</tspan><tspan x="56" dy="19.2">consequence is sufficient. Authority originates from the legitimate authority</tspan><tspan x="56" dy="19.2">source; a Connection Profile may carry evidence of a valid delegation.</tspan></text>
<rect x="790" y="770" width="706" height="150" rx="12" fill="#fdeceb" stroke="#c0392b" stroke-width="2"/>
<rect x="790" y="770" width="706" height="6" rx="3" fill="#c0392b"/>
<text x="806" y="804" font-size="19" fill="#c0392b" font-weight="700" text-anchor="start"><tspan x="806" dy="0.0">TA-14 GOVERNS ONLY AT ITS COMMIT BOUNDARY</tspan></text>
<text x="806" y="839.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="806" dy="0.0">If TA-14 returns HOLD and the same consequence can still execute through a path,</tspan><tspan x="806" dy="19.2">TA-14 is advisory at that path — not execution governance.</tspan></text>
<rect x="0" y="980" width="1536" height="44" fill="#0b2340"/><text x="40" y="1008" font-size="14" fill="#c9d7e4">TA-14 working technical response to questions raised by David Holmberg. Not authored, endorsed or accepted by David Holmberg or NIST.</text></svg>
