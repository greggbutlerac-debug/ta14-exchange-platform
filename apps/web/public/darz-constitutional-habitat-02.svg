<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#101a33"/><stop offset="1" stop-color="#144b63"/></linearGradient></defs><rect width="1440" height="810" fill="url(#b)"/><text x="70" y="82" fill="#7fe3f1" font-family="Arial" font-size="22" font-weight="bold">02  /  CONSTITUTIONAL INTELLIGENCE HABITAT</text><text x="70" y="151" fill="white" font-family="Arial" font-size="53" font-weight="bold">From development to governed evolution</text><text x="70" y="196" fill="#b8dbe8" font-family="Arial" font-size="24">DAR-Z AI Ω∞ · Illustrative process, not a verified implementation</text><rect x="65" y="260" width="405" height="164" rx="19" fill="#122d4a" stroke="#2ca2c3" stroke-width="2"/><circle cx="109" cy="306" r="27" fill="#25c5d4"/><text x="109" y="314" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#07253a">01</text><text x="149" y="313" fill="white" font-family="Arial" font-size="26" font-weight="bold">DESIGN</text><foreignObject x="90" y="346" width="355" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font:20px Arial;color:#d0e7ee;line-height:1.3">Define purpose, principles and constitutional boundaries</div></foreignObject></rect><rect x="520" y="260" width="405" height="164" rx="19" fill="#153c56" stroke="#2ca2c3" stroke-width="2"/><circle cx="564" cy="306" r="27" fill="#25c5d4"/><text x="564" y="314" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#07253a">02</text><text x="604" y="313" fill="white" font-family="Arial" font-size="26" font-weight="bold">DOCUMENT</text><foreignObject x="545" y="346" width="355" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font:20px Arial;color:#d0e7ee;line-height:1.3">Capture claims, evidence, provenance and stewardship</div></foreignObject></rect><rect x="975" y="260" width="405" height="164" rx="19" fill="#122d4a" stroke="#2ca2c3" stroke-width="2"/><circle cx="1019" cy="306" r="27" fill="#25c5d4"/><text x="1019" y="314" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#07253a">03</text><text x="1059" y="313" fill="white" font-family="Arial" font-size="26" font-weight="bold">EVALUATE</text><foreignObject x="1000" y="346" width="355" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font:20px Arial;color:#d0e7ee;line-height:1.3">Review claims and identify unresolved evidence gaps</div></foreignObject></rect><rect x="65" y="470" width="405" height="164" rx="19" fill="#153c56" stroke="#2ca2c3" stroke-width="2"/><circle cx="109" cy="516" r="27" fill="#25c5d4"/><text x="109" y="524" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#07253a">04</text><text x="149" y="523" fill="white" font-family="Arial" font-size="26" font-weight="bold">IMPLEMENT</text><foreignObject x="90" y="556" width="355" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font:20px Arial;color:#d0e7ee;line-height:1.3">Apply local governance; specification alone grants no authority</div></foreignObject></rect><rect x="520" y="470" width="405" height="164" rx="19" fill="#122d4a" stroke="#2ca2c3" stroke-width="2"/><circle cx="564" cy="516" r="27" fill="#25c5d4"/><text x="564" y="524" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#07253a">05</text><text x="604" y="523" fill="white" font-family="Arial" font-size="26" font-weight="bold">OBSERVE</text><foreignObject x="545" y="556" width="355" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font:20px Arial;color:#d0e7ee;line-height:1.3">Distinguish implementation evidence from declared intent</div></foreignObject></rect><rect x="975" y="470" width="405" height="164" rx="19" fill="#153c56" stroke="#2ca2c3" stroke-width="2"/><circle cx="1019" cy="516" r="27" fill="#25c5d4"/><text x="1019" y="524" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#07253a">06</text><text x="1059" y="523" fill="white" font-family="Arial" font-size="26" font-weight="bold">EVOLVE</text><foreignObject x="1000" y="556" width="355" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font:20px Arial;color:#d0e7ee;line-height:1.3">Record change, revisions and accountable history</div></foreignObject></rect><rect x="65" y="708" width="1310" height="65" rx="12" fill="#10324a"/><text x="720" y="748" text-anchor="middle" fill="#d8f6ff" font-family="Arial" font-size="21">PEOPLE  →  EVIDENCE  →  GOVERNANCE  →  ACCOUNTABILITY  →  CONTINUITY</text></svg>