<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="PROVENANCE AND DATA CUSTODY"><defs><marker id="ah-bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f4f7fa"/></marker><marker id="ah-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0b2340"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0d1b2a"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a5d70"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c7d3df"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fd1"/></marker><marker id="ah-blue_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e6f0fc"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f8a4c"/></marker><marker id="ah-green_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e5f5ec"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b5730a"/></marker><marker id="ah-amber_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fdf3e1"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker><marker id="ah-red_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fdeceb"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b3fb5"/></marker><marker id="ah-violet_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#efe8fb"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f7c86"/></marker><marker id="ah-teal_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e2f4f5"/></marker><marker id="ah-gray_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#eef2f6"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/></marker><marker id="ah-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e7c76e"/></marker></defs><rect width="1536" height="1024" fill="#f4f7fa"/><rect x="0" y="0" width="1536" height="118" fill="#0b2340"/><text x="40" y="38" font-size="18" fill="#e7c76e" font-weight="700" letter-spacing="2">LESSON 04 OF 08</text><text x="40" y="78" font-size="34" fill="#ffffff" font-weight="700">PROVENANCE AND DATA CUSTODY</text><text x="40" y="106" font-size="18" fill="#9fd8ff">Evidence originates in source systems and custodians. It is presented to the consequence examination.</text>
<rect x="40" y="150" width="270" height="250" rx="12" fill="#e6f0fc" stroke="#1f6fd1" stroke-width="2"/>
<rect x="40" y="150" width="270" height="6" rx="3" fill="#1f6fd1"/>
<text x="56" y="184" font-size="19" fill="#1f6fd1" font-weight="700" text-anchor="start"><tspan x="56" dy="0.0">1 · SENSOR</tspan></text>
<text x="56" y="219.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="56" dy="0.0">Device ID, location,</tspan><tspan x="56" dy="19.2">calibration. Raw value 1,100</tspan><tspan x="56" dy="19.2">ppm. Source timestamp</tspan><tspan x="56" dy="19.2">10:14:03.</tspan></text>
<line x1="310" y1="275" x2="330" y2="275" stroke="#1f6fd1" stroke-width="3" marker-end="url(#ah-blue)"/>
<rect x="330" y="150" width="270" height="250" rx="12" fill="#e6f0fc" stroke="#1f6fd1" stroke-width="2"/>
<rect x="330" y="150" width="270" height="6" rx="3" fill="#1f6fd1"/>
<text x="346" y="184" font-size="19" fill="#1f6fd1" font-weight="700" text-anchor="start"><tspan x="346" dy="0.0">2 · BAS CONTROLLER</tspan></text>
<text x="346" y="219.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="346" dy="0.0">System ID, local logic,</tspan><tspan x="346" dy="19.2">local timestamp 10:14:05,</tspan><tspan x="346" dy="19.2">change history.</tspan></text>
<line x1="600" y1="275" x2="620" y2="275" stroke="#1f6fd1" stroke-width="3" marker-end="url(#ah-blue)"/>
<rect x="620" y="150" width="270" height="250" rx="12" fill="#e2f4f5" stroke="#0f7c86" stroke-width="2"/>
<rect x="620" y="150" width="270" height="6" rx="3" fill="#0f7c86"/>
<text x="636" y="184" font-size="19" fill="#0f7c86" font-weight="700" text-anchor="start"><tspan x="636" dy="0.0">3 · NETWORK</tspan></text>
<text x="636" y="219.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="636" dy="0.0">Transport and integrity</tspan><tspan x="636" dy="19.2">logs, security controls.</tspan></text>
<line x1="890" y1="275" x2="910" y2="275" stroke="#0f7c86" stroke-width="3" marker-end="url(#ah-teal)"/>
<rect x="910" y="150" width="270" height="250" rx="12" fill="#efe8fb" stroke="#6b3fb5" stroke-width="2"/>
<rect x="910" y="150" width="270" height="6" rx="3" fill="#6b3fb5"/>
<text x="926" y="184" font-size="19" fill="#6b3fb5" font-weight="700" text-anchor="start"><tspan x="926" dy="0.0">4 · CUSTODIAN /</tspan><tspan x="926" dy="24.3">HISTORIAN</tspan></text>
<text x="926" y="243.32" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="926" dy="0.0">Stores and transforms:</tspan><tspan x="926" dy="19.2">5-minute average = 980 ppm.</tspan><tspan x="926" dy="19.2">Served-at timestamp</tspan><tspan x="926" dy="19.2">10:14:20. Access and change</tspan><tspan x="926" dy="19.2">history.</tspan></text>
<line x1="1180" y1="275" x2="1200" y2="275" stroke="#6b3fb5" stroke-width="3" marker-end="url(#ah-violet)"/>
<rect x="1200" y="150" width="270" height="250" rx="12" fill="#fdf3e1" stroke="#b5730a" stroke-width="2"/>
<rect x="1200" y="150" width="270" height="6" rx="3" fill="#b5730a"/>
<text x="1216" y="184" font-size="19" fill="#b5730a" font-weight="700" text-anchor="start"><tspan x="1216" dy="0.0">5 · EVIDENCE PRESENTED</tspan></text>
<text x="1216" y="219.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="1216" dy="0.0">Values plus the provenance</tspan><tspan x="1216" dy="19.2">records the custodian</tspan><tspan x="1216" dy="19.2">supplies, for this proposed</tspan><tspan x="1216" dy="19.2">consequence.</tspan></text>
<line x1="1350" y1="400" x2="1350" y2="440" stroke="#b5730a" stroke-width="3" marker-end="url(#ah-amber)"/>
<rect x="760" y="445" width="736" height="215" rx="12" fill="#e5f5ec" stroke="#1f8a4c" stroke-width="3"/>
<text x="780" y="482" font-size="20" fill="#1f8a4c" font-weight="700" text-anchor="start"><tspan x="780" dy="0.0">TA-14 CONSEQUENCE EXAMINATION</tspan></text>
<text x="780" y="512" font-size="16" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="780" dy="0.0">Evaluates the records presented against declared admissibility criteria for</tspan><tspan x="780" dy="20.5">this consequence class, NOW → ALLOW · HOLD · DENY · ESCALATE.</tspan></text>
<text x="780" y="572" font-size="16" fill="#c0392b" font-weight="700" text-anchor="start"><tspan x="780" dy="0.0">Does NOT create, store, re-measure or independently verify the chain. Does NOT</tspan><tspan x="780" dy="20.5">make evidence true. It consumes what the evidence and custody layers supply.</tspan></text>
<rect x="40" y="445" width="690" height="215" rx="12" fill="#e6f0fc" stroke="#1f6fd1" stroke-width="2"/>
<rect x="40" y="445" width="690" height="6" rx="3" fill="#1f6fd1"/>
<text x="56" y="479" font-size="19" fill="#1f6fd1" font-weight="700" text-anchor="start"><tspan x="56" dy="0.0">WHO CREATES AND PRESERVES PROVENANCE</tspan></text>
<circle cx="62" cy="509.0" r="3.5" fill="#1f6fd1"/>
<text x="74" y="514.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="74" dy="0.0">Devices and sensors: identity, raw value, source timestamp</tspan></text>
<circle cx="62" cy="538.0" r="3.5" fill="#1f6fd1"/>
<text x="74" y="543.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="74" dy="0.0">Controllers and applications: logic, transformations, local time</tspan></text>
<circle cx="62" cy="567.0" r="3.5" fill="#1f6fd1"/>
<text x="74" y="572.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="74" dy="0.0">Networks: transport and integrity records</tspan></text>
<circle cx="62" cy="596.0" r="3.5" fill="#1f6fd1"/>
<text x="74" y="601.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="74" dy="0.0">Custodians and receiving systems: storage, access and change history</tspan></text>
<circle cx="62" cy="625.0" r="3.5" fill="#1f6fd1"/>
<text x="74" y="630.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="74" dy="0.0">Not the Connection Profile. Not TA-14.</tspan></text>
<rect x="40" y="685" width="480" height="285" rx="12" fill="#efe8fb" stroke="#6b3fb5" stroke-width="2"/>
<rect x="40" y="685" width="480" height="6" rx="3" fill="#6b3fb5"/>
<text x="56" y="719" font-size="17" fill="#6b3fb5" font-weight="700" text-anchor="start"><tspan x="56" dy="0.0">MINIMUM TO ACCOMPANY A CONSEQUENTIAL VALUE</tspan><tspan x="56" dy="21.8">(PROPOSAL)</tspan></text>
<circle cx="62" cy="768.76" r="3.5" fill="#6b3fb5"/>
<text x="74" y="773.76" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="74" dy="0.0">Building object identity</tspan></text>
<circle cx="62" cy="797.76" r="3.5" fill="#6b3fb5"/>
<text x="74" y="802.76" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="74" dy="0.0">Source device identity</tspan></text>
<circle cx="62" cy="826.76" r="3.5" fill="#6b3fb5"/>
<text x="74" y="831.76" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="74" dy="0.0">Source timestamp (not only served-at)</tspan></text>
<circle cx="62" cy="855.76" r="3.5" fill="#6b3fb5"/>
<text x="74" y="860.76" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="74" dy="0.0">Value and unit</tspan></text>
<circle cx="62" cy="884.76" r="3.5" fill="#6b3fb5"/>
<text x="74" y="889.76" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="74" dy="0.0">Quality / validity flag</tspan></text>
<circle cx="62" cy="913.76" r="3.5" fill="#6b3fb5"/>
<text x="74" y="918.76" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="74" dy="0.0">Transformation flag (raw or derived)</tspan></text>
<rect x="540" y="685" width="470" height="285" rx="12" fill="#fdeceb" stroke="#c0392b" stroke-width="2"/>
<rect x="540" y="685" width="470" height="6" rx="3" fill="#c0392b"/>
<text x="556" y="719" font-size="19" fill="#c0392b" font-weight="700" text-anchor="start"><tspan x="556" dy="0.0">TRACEABILITY ≠ TRUTH</tspan></text>
<text x="556" y="754.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="556" dy="0.0">A fresh, fully traced value can still be wrong:</tspan><tspan x="556" dy="19.2">stuck sensor, wrong device, drifted calibration.</tspan><tspan x="556" dy="19.2">Here the custodian served the value at 10:14:20, but</tspan><tspan x="556" dy="19.2">the source reading is from 10:14:03 — custodian</tspan><tspan x="556" dy="19.2">freshness is not source freshness.</tspan></text>
<rect x="1030" y="685" width="466" height="285" rx="12" fill="#fdf3e1" stroke="#b5730a" stroke-width="2"/>
<rect x="1030" y="685" width="466" height="6" rx="3" fill="#b5730a"/>
<text x="1046" y="719" font-size="19" fill="#b5730a" font-weight="700" text-anchor="start"><tspan x="1046" dy="0.0">WHO DECLARES ADMISSIBILITY CRITERIA?</tspan></text>
<text x="1046" y="754.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="1046" dy="0.0">The owner or operator, for each consequence class:</tspan><tspan x="1046" dy="19.2">required sources, maximum source age, quality</tspan><tspan x="1046" dy="19.2">flags, redundancy. Who maintains these criteria is</tspan><tspan x="1046" dy="19.2">an open question for each deployment.</tspan></text>
<rect x="0" y="980" width="1536" height="44" fill="#0b2340"/><text x="40" y="1008" font-size="14" fill="#c9d7e4">TA-14 working technical response to questions raised by David Holmberg. Not authored, endorsed or accepted by David Holmberg or NIST.</text></svg>
