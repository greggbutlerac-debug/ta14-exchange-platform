<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="CMMS ↔ BAS: GO / NO-GO AND WHERE THE DECISION LIVES"><defs><marker id="ah-bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f4f7fa"/></marker><marker id="ah-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0b2340"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0d1b2a"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a5d70"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c7d3df"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fd1"/></marker><marker id="ah-blue_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e6f0fc"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f8a4c"/></marker><marker id="ah-green_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e5f5ec"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b5730a"/></marker><marker id="ah-amber_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fdf3e1"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker><marker id="ah-red_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fdeceb"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b3fb5"/></marker><marker id="ah-violet_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#efe8fb"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f7c86"/></marker><marker id="ah-teal_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e2f4f5"/></marker><marker id="ah-gray_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#eef2f6"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/></marker><marker id="ah-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e7c76e"/></marker></defs><rect width="1536" height="1024" fill="#f4f7fa"/><rect x="0" y="0" width="1536" height="118" fill="#0b2340"/><text x="40" y="38" font-size="18" fill="#e7c76e" font-weight="700" letter-spacing="2">LESSON 07 OF 08</text><text x="40" y="78" font-size="34" fill="#ffffff" font-weight="700">CMMS ↔ BAS: GO / NO-GO AND WHERE THE DECISION LIVES</text><text x="40" y="106" font-size="18" fill="#9fd8ff">David&#x27;s scenario: the CMMS reads AHU status and shows the technician GO or NO-GO.</text>
<rect x="40" y="150" width="260" height="230" rx="12" fill="#e6f0fc" stroke="#1f6fd1" stroke-width="2"/>
<rect x="40" y="150" width="260" height="6" rx="3" fill="#1f6fd1"/>
<text x="56" y="184" font-size="19" fill="#1f6fd1" font-weight="700" text-anchor="start"><tspan x="56" dy="0.0">BAS</tspan></text>
<text x="56" y="219.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="56" dy="0.0">AHU-1 fan status, filter</tspan><tspan x="56" dy="19.2">pressure drop, alarms —</tspan><tspan x="56" dy="19.2">with source timestamps.</tspan></text>
<rect x="340" y="150" width="300" height="230" rx="12" fill="#efe8fb" stroke="#6b3fb5" stroke-width="2"/>
<rect x="340" y="150" width="300" height="6" rx="3" fill="#6b3fb5"/>
<text x="356" y="184" font-size="19" fill="#6b3fb5" font-weight="700" text-anchor="start"><tspan x="356" dy="0.0">CONNECTION (READ-ONLY)</tspan></text>
<text x="356" y="219.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="356" dy="0.0">Status points only. Carries</tspan><tspan x="356" dy="19.2">data; does not know what the</tspan><tspan x="356" dy="19.2">CMMS does with it.</tspan></text>
<rect x="680" y="150" width="300" height="230" rx="12" fill="#fdf3e1" stroke="#b5730a" stroke-width="2"/>
<rect x="680" y="150" width="300" height="6" rx="3" fill="#b5730a"/>
<text x="696" y="184" font-size="19" fill="#b5730a" font-weight="700" text-anchor="start"><tspan x="696" dy="0.0">CMMS LOGIC</tspan></text>
<text x="696" y="219.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="696" dy="0.0">Rule: fan OFF and lockout</tspan><tspan x="696" dy="19.2">confirmed → GO; otherwise</tspan><tspan x="696" dy="19.2">NO-GO. The decision is made</tspan><tspan x="696" dy="19.2">here.</tspan></text>
<rect x="1020" y="150" width="220" height="230" rx="12" fill="#e5f5ec" stroke="#1f8a4c" stroke-width="2"/>
<rect x="1020" y="150" width="220" height="6" rx="3" fill="#1f8a4c"/>
<text x="1036" y="184" font-size="19" fill="#1f8a4c" font-weight="700" text-anchor="start"><tspan x="1036" dy="0.0">TECHNICIAN TABLET</tspan></text>
<text x="1036" y="219.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="1036" dy="0.0">Shows GO or NO-GO.</tspan></text>
<rect x="1280" y="150" width="216" height="230" rx="12" fill="#fdeceb" stroke="#c0392b" stroke-width="2"/>
<rect x="1280" y="150" width="216" height="6" rx="3" fill="#c0392b"/>
<text x="1296" y="184" font-size="19" fill="#c0392b" font-weight="700" text-anchor="start"><tspan x="1296" dy="0.0">TECHNICIAN ACTS</tspan></text>
<text x="1296" y="219.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="1296" dy="0.0">Physical act. No</tspan><tspan x="1296" dy="19.2">technical stop on a</tspan><tspan x="1296" dy="19.2">human hand.</tspan></text>
<line x1="300" y1="265" x2="338" y2="265" stroke="#1f6fd1" stroke-width="3" marker-end="url(#ah-blue)"/>
<line x1="640" y1="265" x2="678" y2="265" stroke="#6b3fb5" stroke-width="3" marker-end="url(#ah-violet)"/>
<line x1="980" y1="265" x2="1018" y2="265" stroke="#b5730a" stroke-width="3" marker-end="url(#ah-amber)"/>
<line x1="1240" y1="265" x2="1278" y2="265" stroke="#1f8a4c" stroke-width="3" marker-end="url(#ah-green)"/>
<rect x="40" y="405" width="700" height="265" rx="12" fill="#fdf3e1" stroke="#b5730a" stroke-width="2"/>
<rect x="40" y="405" width="700" height="6" rx="3" fill="#b5730a"/>
<text x="56" y="439" font-size="19" fill="#b5730a" font-weight="700" text-anchor="start"><tspan x="56" dy="0.0">WHERE EACH THING HAPPENS</tspan></text>
<circle cx="62" cy="469.0" r="3.5" fill="#b5730a"/>
<text x="74" y="474.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="74" dy="0.0">Authority determination for the work: the CMMS work order and the maintenance</tspan><tspan x="74" dy="19.2">organization’s rules</tspan></text>
<circle cx="62" cy="517.2" r="3.5" fill="#b5730a"/>
<text x="74" y="522.2" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="74" dy="0.0">GO / NO-GO decision: CMMS logic, using BAS data that crossed the connection</tspan></text>
<circle cx="62" cy="546.2" r="3.5" fill="#b5730a"/>
<text x="74" y="551.2" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="74" dy="0.0">Enforcement on the human act: none technical — the technician can ignore</tspan><tspan x="74" dy="19.2">NO-GO; the CMMS records what was shown and done</tspan></text>
<circle cx="62" cy="594.4000000000001" r="3.5" fill="#b5730a"/>
<text x="74" y="599.4000000000001" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="74" dy="0.0">If the CMMS instead commands the BAS (for example, stop the fan), the BAS</tspan><tspan x="74" dy="19.2">gateway is the enforcement point for that write</tspan></text>
<rect x="770" y="405" width="726" height="265" rx="12" fill="#efe8fb" stroke="#6b3fb5" stroke-width="2"/>
<rect x="770" y="405" width="726" height="6" rx="3" fill="#6b3fb5"/>
<text x="786" y="439" font-size="19" fill="#6b3fb5" font-weight="700" text-anchor="start"><tspan x="786" dy="0.0">WHERE IS THE CONNECTION HOSTED? WHO KEEPS THE RECORDS?</tspan></text>
<circle cx="792" cy="469.0" r="3.5" fill="#6b3fb5"/>
<text x="804" y="474.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="804" dy="0.0">Hosting is a deployment choice: the BAS integration gateway, an integration</tspan><tspan x="804" dy="19.2">server, or a digital twin / data custodian</tspan></text>
<circle cx="792" cy="517.2" r="3.5" fill="#6b3fb5"/>
<text x="804" y="522.2" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="804" dy="0.0">The host keeps the connection-instance state; the BAS and the custodian keep the</tspan><tspan x="804" dy="19.2">data and its history</tspan></text>
<circle cx="792" cy="565.4000000000001" r="3.5" fill="#6b3fb5"/>
<text x="804" y="570.4000000000001" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="804" dy="0.0">One custodian hosting every connection concentrates authority and attack surface</tspan></text>
<circle cx="792" cy="594.4000000000001" r="3.5" fill="#6b3fb5"/>
<text x="804" y="599.4000000000001" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="804" dy="0.0">If the custodian is stale, every connection inherits it — source timestamps must</tspan><tspan x="804" dy="19.2">travel with the data</tspan></text>
<rect x="40" y="690" width="700" height="275" rx="12" fill="#e6f0fc" stroke="#1f6fd1" stroke-width="2"/>
<rect x="40" y="690" width="700" height="6" rx="3" fill="#1f6fd1"/>
<text x="56" y="724" font-size="19" fill="#1f6fd1" font-weight="700" text-anchor="start"><tspan x="56" dy="0.0">READ-ONLY ANALYTICS</tspan></text>
<text x="56" y="759.0" font-size="16" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="56" dy="0.0">An analytics provider receives building data and returns a recommended</tspan><tspan x="56" dy="20.5">setpoint. The recommendation is data, not a control right. Acting on it</tspan><tspan x="56" dy="20.5">requires a control right and commit permission at the enforcement point.</tspan></text>
<rect x="770" y="690" width="726" height="275" rx="12" fill="#fdeceb" stroke="#c0392b" stroke-width="2"/>
<rect x="770" y="690" width="726" height="6" rx="3" fill="#c0392b"/>
<text x="786" y="724" font-size="19" fill="#c0392b" font-weight="700" text-anchor="start"><tspan x="786" dy="0.0">WHAT THE CONNECTION DOES NOT ESTABLISH</tspan></text>
<circle cx="792" cy="754.0" r="3.5" fill="#c0392b"/>
<text x="804" y="759.0" font-size="16" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="804" dy="0.0">That the data is correct or current</tspan></text>
<circle cx="792" cy="784.0" r="3.5" fill="#c0392b"/>
<text x="804" y="789.0" font-size="16" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="804" dy="0.0">What the receiving system decides</tspan></text>
<circle cx="792" cy="814.0" r="3.5" fill="#c0392b"/>
<text x="804" y="819.0" font-size="16" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="804" dy="0.0">Control authority, unless a control right is explicitly granted</tspan></text>
<rect x="0" y="980" width="1536" height="44" fill="#0b2340"/><text x="40" y="1008" font-size="14" fill="#c9d7e4">TA-14 working technical response to questions raised by David Holmberg. Not authored, endorsed or accepted by David Holmberg or NIST.</text></svg>
