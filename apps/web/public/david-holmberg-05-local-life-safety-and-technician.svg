<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="LOCAL CONTROL, LIFE SAFETY AND THE TECHNICIAN"><defs><marker id="ah-bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f4f7fa"/></marker><marker id="ah-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0b2340"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0d1b2a"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a5d70"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c7d3df"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fd1"/></marker><marker id="ah-blue_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e6f0fc"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f8a4c"/></marker><marker id="ah-green_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e5f5ec"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b5730a"/></marker><marker id="ah-amber_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fdf3e1"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker><marker id="ah-red_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fdeceb"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b3fb5"/></marker><marker id="ah-violet_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#efe8fb"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f7c86"/></marker><marker id="ah-teal_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e2f4f5"/></marker><marker id="ah-gray_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#eef2f6"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/></marker><marker id="ah-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e7c76e"/></marker></defs><rect width="1536" height="1024" fill="#f4f7fa"/><rect x="0" y="0" width="1536" height="118" fill="#0b2340"/><text x="40" y="38" font-size="18" fill="#e7c76e" font-weight="700" letter-spacing="2">LESSON 05 OF 08</text><text x="40" y="78" font-size="34" fill="#ffffff" font-weight="700">LOCAL CONTROL, LIFE SAFETY AND THE TECHNICIAN</text><text x="40" y="106" font-size="18" fill="#9fd8ff">Not every building action crosses a Connection Profile — or reaches an automated commit boundary.</text>
<rect x="40" y="150" width="460" height="420" rx="12" fill="#e6f0fc" stroke="#1f6fd1" stroke-width="2"/>
<rect x="40" y="150" width="460" height="6" rx="3" fill="#1f6fd1"/>
<text x="56" y="184" font-size="19" fill="#1f6fd1" font-weight="700" text-anchor="start"><tspan x="56" dy="0.0">A · LOCAL AUTOMATED CONTROL</tspan></text>
<text x="56" y="219.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="56" dy="0.0">A rooftop unit stages on local temperature; a VAV</tspan><tspan x="56" dy="19.2">box modulates on local CO₂; lighting follows local</tspan><tspan x="56" dy="19.2">occupancy.</tspan></text>
<circle cx="62" cy="281.4" r="3.5" fill="#1f6fd1"/>
<text x="74" y="286.4" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="74" dy="0.0">No information crosses to another party: no</tspan><tspan x="74" dy="19.2">Connection Profile</tspan></text>
<circle cx="62" cy="329.59999999999997" r="3.5" fill="#1f6fd1"/>
<text x="74" y="334.59999999999997" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="74" dy="0.0">The local controller and its configuration</tspan><tspan x="74" dy="19.2">govern</tspan></text>
<circle cx="62" cy="377.79999999999995" r="3.5" fill="#1f6fd1"/>
<text x="74" y="382.79999999999995" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="74" dy="0.0">TA-14 governs only where it is deployed at a</tspan><tspan x="74" dy="19.2">local commit point for a declared consequence</tspan><tspan x="74" dy="19.2">class</tspan></text>
<rect x="540" y="150" width="460" height="420" rx="12" fill="#fdeceb" stroke="#c0392b" stroke-width="2"/>
<rect x="540" y="150" width="460" height="6" rx="3" fill="#c0392b"/>
<text x="556" y="184" font-size="19" fill="#c0392b" font-weight="700" text-anchor="start"><tspan x="556" dy="0.0">B · LIFE-SAFETY SEQUENCES</tspan></text>
<text x="556" y="219.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="556" dy="0.0">Fire alarm outputs, smoke control, emergency</tspan><tspan x="556" dy="19.2">egress release.</tspan></text>
<circle cx="562" cy="262.2" r="3.5" fill="#c0392b"/>
<text x="574" y="267.2" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="574" dy="0.0">Governed by code, listing and the authority</tspan><tspan x="574" dy="19.2">having jurisdiction (AHJ)</tspan></text>
<circle cx="562" cy="310.4" r="3.5" fill="#c0392b"/>
<text x="574" y="315.4" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="574" dy="0.0">Must never wait on a TA-14 HOLD</tspan></text>
<circle cx="562" cy="339.4" r="3.5" fill="#c0392b"/>
<text x="574" y="344.4" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="574" dy="0.0">Outside TA-14 consequence classes</tspan></text>
<rect x="1040" y="150" width="456" height="420" rx="12" fill="#fdf3e1" stroke="#b5730a" stroke-width="2"/>
<rect x="1040" y="150" width="456" height="6" rx="3" fill="#b5730a"/>
<text x="1056" y="184" font-size="17" fill="#b5730a" font-weight="700" text-anchor="start"><tspan x="1056" dy="0.0">C · TECHNICIAN REPLACES A FILTER (DAVID&#x27;S</tspan><tspan x="1056" dy="21.8">SCENARIO 1)</tspan></text>
<rect x="1060" y="240" width="416" height="40" rx="8" fill="#ffffff" stroke="#b5730a" stroke-width="2"/>
<text x="1076" y="266" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="1076" dy="0.0">CMMS issues the work order</tspan></text>
<line x1="1268" y1="280" x2="1268" y2="294" stroke="#b5730a" stroke-width="2" marker-end="url(#ah-amber)"/>
<rect x="1060" y="296" width="416" height="40" rx="8" fill="#ffffff" stroke="#b5730a" stroke-width="2"/>
<text x="1076" y="322" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="1076" dy="0.0">Technician goes to AHU-1</tspan></text>
<line x1="1268" y1="336" x2="1268" y2="350" stroke="#b5730a" stroke-width="2" marker-end="url(#ah-amber)"/>
<rect x="1060" y="352" width="416" height="40" rx="8" fill="#ffffff" stroke="#b5730a" stroke-width="2"/>
<text x="1076" y="378" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="1076" dy="0.0">Checks safety conditions (lockout, fan off)</tspan></text>
<line x1="1268" y1="392" x2="1268" y2="406" stroke="#b5730a" stroke-width="2" marker-end="url(#ah-amber)"/>
<rect x="1060" y="408" width="416" height="40" rx="8" fill="#ffffff" stroke="#b5730a" stroke-width="2"/>
<text x="1076" y="434" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="1076" dy="0.0">Opens the door, exchanges the filter</tspan></text>
<line x1="1268" y1="448" x2="1268" y2="462" stroke="#b5730a" stroke-width="2" marker-end="url(#ah-amber)"/>
<rect x="1060" y="464" width="416" height="40" rx="8" fill="#ffffff" stroke="#b5730a" stroke-width="2"/>
<text x="1076" y="490" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="1076" dy="0.0">Updates the CMMS record</tspan></text>
<text x="1060" y="538" font-size="14" fill="#0d1b2a" font-weight="700" text-anchor="start"><tspan x="1060" dy="0.0">One organization, a human using the CMMS interface:</tspan><tspan x="1060" dy="17.9">no Connection Profile.</tspan></text>
<rect x="40" y="600" width="700" height="320" rx="12" fill="#fdf3e1" stroke="#b5730a" stroke-width="2"/>
<rect x="40" y="600" width="700" height="6" rx="3" fill="#b5730a"/>
<text x="56" y="634" font-size="19" fill="#b5730a" font-weight="700" text-anchor="start"><tspan x="56" dy="0.0">NO AUTOMATED COMMIT BOUNDARY FOR A HUMAN HAND</tspan></text>
<circle cx="62" cy="664.0" r="3.5" fill="#b5730a"/>
<text x="74" y="669.0" font-size="16" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="74" dy="0.0">Software can advise — checklist, warnings, GO / NO-GO — but cannot</tspan><tspan x="74" dy="20.5">physically stop the technician</tspan></text>
<circle cx="62" cy="714.48" r="3.5" fill="#b5730a"/>
<text x="74" y="719.48" font-size="16" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="74" dy="0.0">Governance of the act: authority to perform the work order, training,</tspan><tspan x="74" dy="20.5">lockout/tagout, procedure, and the record</tspan></text>
<circle cx="62" cy="764.96" r="3.5" fill="#b5730a"/>
<text x="74" y="769.96" font-size="16" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="74" dy="0.0">TA-14 may examine the work-order consequence and advise. It is not</tspan><tspan x="74" dy="20.5">execution governance for the physical act</tspan></text>
<circle cx="62" cy="815.44" r="3.5" fill="#b5730a"/>
<text x="74" y="820.44" font-size="16" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="74" dy="0.0">If the technician ignores NO-GO, the record must show it; nothing in the</tspan><tspan x="74" dy="20.5">architecture prevents it</tspan></text>
<rect x="770" y="600" width="726" height="320" rx="12" fill="#efe8fb" stroke="#6b3fb5" stroke-width="2"/>
<rect x="770" y="600" width="726" height="6" rx="3" fill="#6b3fb5"/>
<text x="786" y="634" font-size="19" fill="#6b3fb5" font-weight="700" text-anchor="start"><tspan x="786" dy="0.0">WHEN IS A CONNECTION PROFILE INVOLVED?</tspan></text>
<circle cx="792" cy="664.0" r="3.5" fill="#6b3fb5"/>
<text x="804" y="669.0" font-size="16" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="804" dy="0.0">On this page: when information or control crosses between independently</tspan><tspan x="804" dy="20.5">governed parties</tspan></text>
<circle cx="792" cy="714.48" r="3.5" fill="#6b3fb5"/>
<text x="804" y="719.48" font-size="16" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="804" dy="0.0">Whether CNS/CP also covers system-to-system links inside one organization</tspan><tspan x="804" dy="20.5">(CMMS ↔ BAS) is set by CNS/CP’s own definition, not by TA-14</tspan></text>
<circle cx="792" cy="764.96" r="3.5" fill="#6b3fb5"/>
<text x="804" y="769.96" font-size="16" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="804" dy="0.0">Absence of a Profile does not mean absence of governance — local authority,</tspan><tspan x="804" dy="20.5">procedure and safety still apply</tspan></text>
<rect x="0" y="980" width="1536" height="44" fill="#0b2340"/><text x="40" y="1008" font-size="14" fill="#c9d7e4">TA-14 working technical response to questions raised by David Holmberg. Not authored, endorsed or accepted by David Holmberg or NIST.</text></svg>
