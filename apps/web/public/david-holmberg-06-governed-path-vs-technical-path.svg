<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="EXTERNAL AGENTS: GOVERNED PATH VS TECHNICAL PATH"><defs><marker id="ah-bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f4f7fa"/></marker><marker id="ah-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0b2340"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0d1b2a"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a5d70"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c7d3df"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fd1"/></marker><marker id="ah-blue_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e6f0fc"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f8a4c"/></marker><marker id="ah-green_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e5f5ec"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b5730a"/></marker><marker id="ah-amber_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fdf3e1"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker><marker id="ah-red_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fdeceb"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b3fb5"/></marker><marker id="ah-violet_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#efe8fb"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f7c86"/></marker><marker id="ah-teal_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e2f4f5"/></marker><marker id="ah-gray_bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#eef2f6"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/></marker><marker id="ah-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e7c76e"/></marker></defs><rect width="1536" height="1024" fill="#f4f7fa"/><rect x="0" y="0" width="1536" height="118" fill="#0b2340"/><text x="40" y="38" font-size="18" fill="#e7c76e" font-weight="700" letter-spacing="2">LESSON 06 OF 08</text><text x="40" y="78" font-size="34" fill="#ffffff" font-weight="700">EXTERNAL AGENTS: GOVERNED PATH VS TECHNICAL PATH</text><text x="40" y="106" font-size="18" fill="#9fd8ff">Rejection on the governed path is not a cybersecurity barrier. Treat the two separately.</text>
<text x="40" y="168" font-size="18" fill="#6b3fb5" font-weight="700" text-anchor="start"><tspan x="40" dy="0.0">LANE 1 · GOVERNED PATH (CNS/CP)</tspan></text>
<rect x="40" y="185" width="300" height="190" rx="12" fill="#e6f0fc" stroke="#1f6fd1" stroke-width="2"/>
<rect x="40" y="185" width="300" height="6" rx="3" fill="#1f6fd1"/>
<text x="56" y="219" font-size="19" fill="#1f6fd1" font-weight="700" text-anchor="start"><tspan x="56" dy="0.0">EXTERNAL AGENT</tspan></text>
<text x="56" y="254.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="56" dy="0.0">An AI agent or vendor asks to</tspan><tspan x="56" dy="19.2">lower the AHU setpoint during a</tspan><tspan x="56" dy="19.2">high-occupancy event.</tspan></text>
<rect x="380" y="185" width="330" height="190" rx="12" fill="#efe8fb" stroke="#6b3fb5" stroke-width="2"/>
<rect x="380" y="185" width="330" height="6" rx="3" fill="#6b3fb5"/>
<text x="396" y="219" font-size="19" fill="#6b3fb5" font-weight="700" text-anchor="start"><tspan x="396" dy="0.0">NO AUTHORIZED CONNECTION</tspan><tspan x="396" dy="24.3">INSTANCE</tspan></text>
<text x="396" y="278.32" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="396" dy="0.0">No grant exists for this actor and</tspan><tspan x="396" dy="19.2">purpose.</tspan></text>
<rect x="750" y="185" width="340" height="190" rx="12" fill="#fdf3e1" stroke="#b5730a" stroke-width="2"/>
<text x="768" y="220" font-size="18" fill="#b5730a" font-weight="700" text-anchor="start"><tspan x="768" dy="0.0">BAS INTEGRATION GATEWAY</tspan></text>
<text x="768" y="250" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="768" dy="0.0">Finds no active instance for this</tspan><tspan x="768" dy="19.2">actor: refuses the request and logs</tspan><tspan x="768" dy="19.2">it.</tspan></text>
<circle cx="1050" cy="220" r="18" fill="#c0392b"/><path d="M1041.9 211.9 L1058.1 228.1 M1058.1 211.9 L1041.9 228.1" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<rect x="1130" y="185" width="366" height="190" rx="12" fill="#e5f5ec" stroke="#1f8a4c" stroke-width="2"/>
<rect x="1130" y="185" width="366" height="6" rx="3" fill="#1f8a4c"/>
<text x="1146" y="219" font-size="19" fill="#1f8a4c" font-weight="700" text-anchor="start"><tspan x="1146" dy="0.0">TA-14 NOT REACHED</tspan></text>
<text x="1146" y="254.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="1146" dy="0.0">Nothing crosses the governed path, so</tspan><tspan x="1146" dy="19.2">there is no consequence to examine on</tspan><tspan x="1146" dy="19.2">this path.</tspan></text>
<line x1="340" y1="280" x2="378" y2="280" stroke="#1f6fd1" stroke-width="3" marker-end="url(#ah-blue)"/>
<line x1="710" y1="280" x2="748" y2="280" stroke="#6b3fb5" stroke-width="3" marker-end="url(#ah-violet)"/>
<line x1="1090" y1="280" x2="1128" y2="280" stroke="#4a5d70" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#ah-muted)"/>
<text x="40" y="430" font-size="18" fill="#c0392b" font-weight="700" text-anchor="start"><tspan x="40" dy="0.0">LANE 2 · UNAUTHORIZED TECHNICAL PATH</tspan></text>
<rect x="40" y="447" width="300" height="200" rx="12" fill="#fdeceb" stroke="#c0392b" stroke-width="2"/>
<rect x="40" y="447" width="300" height="6" rx="3" fill="#c0392b"/>
<text x="56" y="481" font-size="19" fill="#c0392b" font-weight="700" text-anchor="start"><tspan x="56" dy="0.0">ATTACKER</tspan></text>
<text x="56" y="516.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="56" dy="0.0">Stolen credential, exploited</tspan><tspan x="56" dy="19.2">vulnerability, or exposed</tspan><tspan x="56" dy="19.2">protocol.</tspan></text>
<rect x="380" y="447" width="330" height="200" rx="12" fill="#fdeceb" stroke="#c0392b" stroke-width="2"/>
<rect x="380" y="447" width="330" height="6" rx="3" fill="#c0392b"/>
<text x="396" y="481" font-size="19" fill="#c0392b" font-weight="700" text-anchor="start"><tspan x="396" dy="0.0">BAS FRONT END / DIRECT</tspan><tspan x="396" dy="24.3">PROTOCOL WRITE</tspan></text>
<text x="396" y="540.3199999999999" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="396" dy="0.0">A path that does not pass the</tspan><tspan x="396" dy="19.2">governed gateway.</tspan></text>
<rect x="750" y="447" width="340" height="200" rx="12" fill="#fdeceb" stroke="#c0392b" stroke-width="2"/>
<rect x="750" y="447" width="340" height="6" rx="3" fill="#c0392b"/>
<text x="766" y="481" font-size="19" fill="#c0392b" font-weight="700" text-anchor="start"><tspan x="766" dy="0.0">AHU SETPOINT CHANGES</tspan></text>
<text x="766" y="516.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="766" dy="0.0">Neither the Connection Profile nor</tspan><tspan x="766" dy="19.2">TA-14 stops this. Absence of a</tspan><tspan x="766" dy="19.2">governed connection is not a</tspan><tspan x="766" dy="19.2">technical barrier.</tspan></text>
<rect x="1130" y="447" width="366" height="200" rx="12" fill="#e2f4f5" stroke="#0f7c86" stroke-width="2"/>
<rect x="1130" y="447" width="366" height="6" rx="3" fill="#0f7c86"/>
<text x="1146" y="481" font-size="19" fill="#0f7c86" font-weight="700" text-anchor="start"><tspan x="1146" dy="0.0">CYBERSECURITY LAYER</tspan></text>
<text x="1146" y="516.0" font-size="15" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="1146" dy="0.0">Authentication, segmentation, least</tspan><tspan x="1146" dy="19.2">privilege, monitoring, detection,</tspan><tspan x="1146" dy="19.2">response — separate responsibilities.</tspan></text>
<line x1="340" y1="547" x2="378" y2="547" stroke="#c0392b" stroke-width="3" marker-end="url(#ah-red)"/>
<line x1="710" y1="547" x2="748" y2="547" stroke="#c0392b" stroke-width="3" marker-end="url(#ah-red)"/>
<rect x="40" y="680" width="720" height="240" rx="12" fill="#e6f0fc" stroke="#1f6fd1" stroke-width="2"/>
<rect x="40" y="680" width="720" height="6" rx="3" fill="#1f6fd1"/>
<text x="56" y="714" font-size="19" fill="#1f6fd1" font-weight="700" text-anchor="start"><tspan x="56" dy="0.0">DEFAULT FOR EXTERNAL AGENTS (DAVID&#x27;S PROPOSED RULE)</tspan></text>
<circle cx="62" cy="744.0" r="3.5" fill="#1f6fd1"/>
<text x="74" y="749.0" font-size="16" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="74" dy="0.0">Read-only, or deny, unless a specific control right is explicitly granted</tspan></text>
<circle cx="62" cy="774.0" r="3.5" fill="#1f6fd1"/>
<text x="74" y="779.0" font-size="16" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="74" dy="0.0">Data received is &quot;good as you get&quot; — no promise of correctness</tspan></text>
<circle cx="62" cy="804.0" r="3.5" fill="#1f6fd1"/>
<text x="74" y="809.0" font-size="16" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="74" dy="0.0">Streaming reasonableness checks and FDD on what is received</tspan></text>
<circle cx="62" cy="834.0" r="3.5" fill="#1f6fd1"/>
<text x="74" y="839.0" font-size="16" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="74" dy="0.0">Any grant beyond read-only is narrow, time-bound and revocable</tspan></text>
<rect x="790" y="680" width="706" height="240" rx="12" fill="#fdf3e1" stroke="#b5730a" stroke-width="2"/>
<rect x="790" y="680" width="706" height="6" rx="3" fill="#b5730a"/>
<text x="806" y="714" font-size="19" fill="#b5730a" font-weight="700" text-anchor="start"><tspan x="806" dy="0.0">RECORD THE TWO OUTCOMES SEPARATELY</tspan></text>
<circle cx="812" cy="744.0" r="3.5" fill="#b5730a"/>
<text x="824" y="749.0" font-size="16" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="824" dy="0.0">Governed-path rejection: who asked, under which (missing) instance,</tspan><tspan x="824" dy="20.5">refused by which component</tspan></text>
<circle cx="812" cy="794.48" r="3.5" fill="#b5730a"/>
<text x="824" y="799.48" font-size="16" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="824" dy="0.0">Cybersecurity event: how the technical path was reached; detected or not</tspan></text>
<circle cx="812" cy="824.48" r="3.5" fill="#b5730a"/>
<text x="824" y="829.48" font-size="16" fill="#0d1b2a" font-weight="400" text-anchor="start"><tspan x="824" dy="0.0">A governance label is never evidence that a technical path was closed</tspan></text>
<rect x="0" y="980" width="1536" height="44" fill="#0b2340"/><text x="40" y="1008" font-size="14" fill="#c9d7e4">TA-14 working technical response to questions raised by David Holmberg. Not authored, endorsed or accepted by David Holmberg or NIST.</text></svg>
